name: Beta Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+"

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository (main)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build plugin
        run: npm run build

      - name: Upload build artifact for debugging
        uses: actions/upload-artifact@v4
        with:
          name: build-output-beta
          path: .scaffold/build/

      - name: Prepare update manifests
        run: npm run prepare-release -- --beta

      - name: Publish auto-update source to gh-pages
        run: |
          set -e
          VERSION=$(node -p "require('./package.json').version")
          rm -rf /tmp/pages
          git clone --depth 1 --branch gh-pages https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git /tmp/pages
          cd /tmp/pages
          git rm -rf --ignore-unmatch . >/dev/null 2>&1 || true
          cp "$GITHUB_WORKSPACE/.scaffold/build/zotero-manager-mcp.xpi" "./zotero-manager-mcp-${VERSION}.xpi"
          cp "$GITHUB_WORKSPACE/update.json" "./update.json"
          cp "$GITHUB_WORKSPACE/update-beta.json" "./update-beta.json"
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="github-actions[bot]@users.noreply.github.com" commit -m "beta release: v${VERSION}"
          git push origin gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Stage release artifact
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          cp .scaffold/build/zotero-manager-mcp.xpi ./zotero-manager-mcp-${VERSION}.xpi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          prerelease: true
          body: |
            Zotero Manager MCP ${{ github.ref_name }} beta auto-release.
          files: |
            zotero-manager-mcp-${{ env.VERSION }}.xpi
