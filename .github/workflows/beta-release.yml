name: Beta Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+"

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository (main)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build plugin
        run: npm run build

      - name: Upload build artifact for debugging
        uses: actions/upload-artifact@v4
        with:
          name: build-output-beta
          path: .scaffold/build/

      - name: Prepare update manifests
        run: npm run prepare-release -- --beta

      - name: Stage Pages assets into gh-pages branch
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p /tmp/release
          cp .scaffold/build/zotero-manager-mcp.xpi /tmp/release/zotero-manager-mcp-${VERSION}.xpi
          cp update.json /tmp/release/update.json
          cp update-beta.json /tmp/release/update-beta.json
          git fetch origin gh-pages --quiet || true
          git checkout -B gh-pages origin/gh-pages 2>/dev/null || git checkout -B gh-pages
          find . -maxdepth 1 -type f ! -name '.*' -delete
          cp /tmp/release/* .
          git add -A

      - name: Commit and push to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "beta release: v${VERSION}" --allow-empty
          git push origin gh-pages:gh-pages --force
        env:
          VERSION: ${{ github.ref_name }}
