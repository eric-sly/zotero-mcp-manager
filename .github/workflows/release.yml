name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository (main)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build plugin
        run: npm run build

      - name: Prepare update manifests
        run: npm run prepare-release

      - name: Publish to gh-pages
        run: |
          set -e
          VERSION=$(node -p "require('./package.json').version")
          # Clone gh-pages into a clean temp dir (never touches the main workspace)
          rm -rf /tmp/pages
          git clone --depth 1 --branch gh-pages https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git /tmp/pages
          cd /tmp/pages
          # Reset to a clean state: keep only release assets
          git rm -rf --ignore-unmatch . >/dev/null 2>&1 || true
          cp "$GITHUB_WORKSPACE/.scaffold/build/zotero-manager-mcp.xpi" "./zotero-manager-mcp-${VERSION}.xpi"
          cp "$GITHUB_WORKSPACE/update.json" "./update.json"
          cp "$GITHUB_WORKSPACE/update-beta.json" "./update-beta.json"
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="github-actions[bot]@users.noreply.github.com" commit -m "release: v${VERSION}"
          git push origin gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
