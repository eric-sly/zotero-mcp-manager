name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository (main)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build plugin
        run: npm run build

      - name: Prepare update manifests
        run: npm run prepare-release

      - name: Stage Pages assets into gh-pages branch
        run: |
          VERSION=$(node -p "require('./package.json').version")
          git fetch origin gh-pages --quiet || true
          git checkout -B gh-pages origin/gh-pages 2>/dev/null || git checkout -B gh-pages --orphan || git checkout -B gh-pages
          rm -f *.xpi update.json update-beta.json
          cp .scaffold/build/zotero-manager-mcp.xpi ./zotero-manager-mcp-${VERSION}.xpi
          cp update.json ./update.json
          cp update-beta.json ./update-beta.json

      - name: Commit and push to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "release: v${VERSION}" --allow-empty
          git push origin gh-pages:gh-pages --force
        env:
          VERSION: ${{ github.ref_name }}
